name: Generate contribution snake

on:
  schedule:
    - cron: "23 3 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF8A00
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF8A00&color_dots=%23202020,%234d3a00,%23b8720a,%23FF8A00,%23FF2E88

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
