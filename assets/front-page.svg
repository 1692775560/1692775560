<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#F6F1E3"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#1A1A1A">
    <!-- top dateline row -->
    <rect x="50" y="38" width="1100" height="2" fill="#1A1A1A"/>
    <text x="50" y="72" font-size="20" letter-spacing="2">VOL. 01 · NO. 1335</text>
    <text x="600" y="72" font-size="20" letter-spacing="2" text-anchor="middle">GITHUB EDITION</text>
    <text x="1150" y="72" font-size="20" letter-spacing="2" text-anchor="end">PRICE: ONE STAR</text>
    <rect x="50" y="86" width="1100" height="2" fill="#1A1A1A"/>

    <!-- nameplate -->
    <text x="600" y="205" font-size="88" font-weight="bold" text-anchor="middle" letter-spacing="2">THE DAILY COMMIT</text>

